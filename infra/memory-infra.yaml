AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Agent 记忆 + 评估 Demo 基础设施 (AWS 中国区 / 海外区通用)。
  创建: S3(代码包+短期会话) / Secrets Manager(DB 密码) / Aurora PostgreSQL Serverless v2(pgvector)
        / Runtime 安全组 / AgentCore Runtime 执行角色。
  前置: 已有 VPC + 至少 2 个不同 AZ 的私有子网 (子网需经 NAT 访问 LLM 网关和 Secrets Manager,
        或自建对应 VPC Endpoint)。

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 至少 2 个不同 AZ 的私有子网。Aurora 和 AgentCore Runtime(VPC 模式)共用
  DBMinCapacity:
    Type: Number
    Default: 0.5
  DBMaxCapacity:
    Type: Number
    Default: 2
  PostgresEngineVersion:
    Type: String
    Default: "16.8"
    Description: 须在目标区域的 Aurora PostgreSQL 可用版本内 (>=15.3 支持 pgvector); 用 aws rds describe-db-engine-versions 确认

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSessions
            Status: Enabled
            Prefix: sessions/
            ExpirationInDays: 30

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Aurora 主账号 (密码仅字母数字, 满足 Mem0 拼接 URI 的要求)
      GenerateSecretString:
        SecretStringTemplate: '{"username": "postgres"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AgentCore Runtime ENI
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - {IpProtocol: "-1", CidrIp: 0.0.0.0/0}

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora pgvector
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref RuntimeSecurityGroup
          Description: Postgres from AgentCore Runtime

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: mem0 pgvector
      SubnetIds: !Ref PrivateSubnetIds

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref PostgresEngineVersion
      DatabaseName: mem0
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds: [!Ref DBSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DBMinCapacity
        MaxCapacity: !Ref DBMaxCapacity

  AuroraWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false

  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: "bedrock-agentcore.amazonaws.com"}   # 各分区一致, 不随 URLSuffix 变化
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref "AWS::AccountId"}
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams, logs:DescribeLogGroups]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: Trace
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets, cloudwatch:PutMetricData]
                Resource: "*"
              - Sid: WorkloadIdentity
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT, bedrock-agentcore:GetWorkloadAccessTokenForUserId]
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: Secrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agent-demo/*"
              - Sid: DbSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret
              - Sid: VpcMode
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

  # 评估 worker (同样跑在 AgentCore Runtime 上): 读可观测性数据 + 调用被测 Runtime(回放) + 写结果
  EvalRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: "bedrock-agentcore.amazonaws.com"}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {"aws:SourceAccount": !Ref "AWS::AccountId"}
      Policies:
        - PolicyName: eval-worker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
              - Sid: ReadObservability
                Effect: Allow
                Action: [logs:StartQuery, logs:FilterLogEvents, logs:GetLogEvents]
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:aws/spans"
              - Sid: QueryResults
                Effect: Allow
                Action: [logs:GetQueryResults, logs:StopQuery, logs:DescribeLogGroups, logs:DescribeQueries]
                Resource: "*"
              - Sid: Replay
                Effect: Allow
                Action: [bedrock-agentcore:InvokeAgentRuntime]
                Resource: !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
              - Sid: Results
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/eval/*"
              - Sid: Secrets
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:agent-demo/*"
              - Sid: Trace
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, cloudwatch:PutMetricData]
                Resource: "*"
              - Sid: WorkloadIdentity
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT, bedrock-agentcore:GetWorkloadAccessTokenForUserId]
                Resource: "*"
              - Sid: VpcMode
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"

Outputs:
  ArtifactBucket:
    Value: !Ref ArtifactBucket
  EvalRuntimeExecutionRoleArn:
    Value: !GetAtt EvalRuntimeExecutionRole.Arn
  DBEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
  DBSecretArn:
    Value: !Ref DBSecret
  RuntimeSecurityGroupId:
    Value: !Ref RuntimeSecurityGroup
  RuntimeExecutionRoleArn:
    Value: !GetAtt RuntimeExecutionRole.Arn
